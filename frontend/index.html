<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InondaVision CI — Carte des inondations</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: grid;
           grid-template-columns: 340px 1fr; height: 100vh; }
    #panel { padding: 16px; background: #0f172a; color: #e2e8f0; overflow-y: auto; }
    #map { height: 100%; }
    h1 { font-size: 1.1rem; margin: 0 0 4px; color: #7dd3fc; }
    .sub { font-size: .8rem; color: #94a3b8; margin-bottom: 16px; }
    label { display: block; margin: 10px 0 4px; font-size: .85rem; }
    input[type="file"] { width: 100%; font-size: .75rem; color: #94a3b8; }
    button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 8px;
             background: #0ea5e9; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    #stats { margin-top: 16px; font-size: .85rem; line-height: 1.6;
             background: #1e293b; border-radius: 8px; padding: 12px; display: none; }
    .warn { color: #fbbf24; font-size: .75rem; margin-top: 10px; }
    .legend { margin-top: 14px; font-size: .8rem; }
    .legend span { display: inline-block; width: 12px; height: 12px;
                   border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>InondaVision CI</h1>
    <div class="sub">Détection d'inondations — Sentinel-1 VV/VH</div>

    <label>Image pré-événement (GeoTIFF VV/VH)</label>
    <input type="file" id="preFile" accept=".tif,.tiff" />

    <label>Image post-événement (GeoTIFF VV/VH)</label>
    <input type="file" id="postFile" accept=".tif,.tiff" />

    <button id="runBtn">Analyser l'inondation</button>

    <div id="stats"></div>
    <div class="warn" id="warning"></div>

    <div class="legend">
      <div><span style="background:#787878"></span> Terre</div>
      <div><span style="background:#0066cc"></span> Eau permanente</div>
      <div><span style="background:#ff5050"></span> Eau d'inondation</div>
    </div>
  </div>
  <div id="map"></div>

  <script>
    const map = L.map('map').setView([5.36, -3.98], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap' }).addTo(map);
    let layer = null;

    const $ = id => document.getElementById(id);
    const runBtn = $('runBtn');

    runBtn.onclick = async () => {
      const pre = $('preFile').files[0];
      const post = $('postFile').files[0];
      $('warning').textContent = '';
      if (!pre || !post) { $('warning').textContent = 'Sélectionnez les deux GeoTIFF.'; return; }

      runBtn.disabled = true; runBtn.textContent = 'Analyse en cours…';
      try {
        const form = new FormData();
        form.append('pre', pre); form.append('post', post);
        const res = await fetch('/api/v1/detect', { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
        const data = await res.json();

        if (layer) map.removeLayer(layer);
        layer = L.geoJSON({ type: 'FeatureCollection',
          features: [
            ...data.permanent_geojson.features.map(f => f),
            ...data.flood_geojson.features,
          ]
        }, {
          style: f => ({
            color: f.properties.class === 'flood_water' ? '#ff5050' : '#0066cc',
            fillColor: f.properties.class === 'flood_water' ? '#ff5050' : '#0066cc',
            fillOpacity: .55, weight: 1
          })
        }).addTo(map);

        const b = data.flood_geojson.features;
        if (b.length) map.fitBounds(layer.getBounds(), { padding: [20, 20] });

        const a = data.areas;
        $('stats').style.display = 'block';
        $('stats').innerHTML =
          `<b>Méthode :</b> ${data.method}<br>` +
          `<b>Surface inondée :</b> ${a.flood_water.area_km2} km² ` +
          `(${a.flood_water.area_hectares} ha)<br>` +
          `<b>Eau permanente :</b> ${a.permanent_water.area_km2} km²<br>` +
          `<b>Polygones flood :</b> ${b.length}<br>` +
          `<b>CRS :</b> ${data.crs}`;
      } catch (e) {
        $('warning').textContent = 'Erreur : ' + e.message;
      } finally {
        runBtn.disabled = false; runBtn.textContent = 'Analyser l’inondation';
      }
    };
  </script>
</body>
</html>
